name: Build FreedomHub VPN (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  actions: read
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Verify REALITY-only connection policy
        shell: pwsh
        run: dotnet run --project tests/ConnectionPolicy/ConnectionPolicy.csproj -c Release

      - name: Publish (self-contained single-file)
        shell: pwsh
        run: |
          dotnet publish v2rayN/v2rayN/v2rayN.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:EnableCompressionInSingleFile=true `
            -o "$env:GITHUB_WORKSPACE\dist\bin"
          echo "publish complete"

      - name: Bundle verified Xray engine
        shell: pwsh
        run: |
          $uri = "https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-windows-64.zip"
          Invoke-WebRequest $uri -OutFile xray.zip
          Invoke-WebRequest "$uri.dgst" -OutFile xray.dgst
          $digest = Get-Content xray.dgst -Raw
          $actual = (Get-FileHash xray.zip -Algorithm SHA256).Hash.ToLower()
          if (-not $digest.ToLower().Contains($actual)) { throw "Xray checksum mismatch" }
          Expand-Archive xray.zip -DestinationPath "$env:GITHUB_WORKSPACE\dist\bin\bin\Xray" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\dist\bin\bin\Xray\*.dat" "$env:GITHUB_WORKSPACE\dist\bin\bin\"
          @("FreedomHub VPN v25", "VLESS + REALITY only on TCP 443.", "Run FreedomHubVPN.exe, sign in and press Connect.", "Google TLS camouflage does not change the server IP.", "No administrator access or TUN driver. Uses your personal Windows system proxy.", "Covers browsers and proxy-aware apps, not every application.", "This package is unsigned.") | Set-Content "$env:GITHUB_WORKSPACE\dist\bin\START-HERE.txt"

      - name: Package zip + SHA-256
        shell: pwsh
        run: |
          $zip = "$env:GITHUB_WORKSPACE\dist\FreedomHubVPN.zip"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\dist\bin\*" -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          "sha256=$hash" | Set-Content -Encoding ascii "$env:GITHUB_WORKSPACE\dist\FreedomHubVPN.sha256.txt"
          Write-Host "zip size: $((Get-Item $zip).Length) bytes"

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreedomHubVPN-zip-unsigned
          path: |
            dist/FreedomHubVPN.zip
            dist/FreedomHubVPN.sha256.txt
          if-no-files-found: error